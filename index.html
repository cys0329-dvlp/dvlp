
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WellSphere - Personal Wellness Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    // 전역 환경 설정
    window.global = window;
    window.process = { 
      env: { NODE_ENV: 'production', API_KEY: '' },
      version: 'v0.0.0',
      nextTick: (cb) => setTimeout(cb, 0)
    };

    // 에러 발생 시 화면에 즉시 표시
    window.onerror = function(msg, url, line, col, error) {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
          <div style="padding: 24px; color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; margin: 20px; border-radius: 16px; font-family: sans-serif; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
            <h1 style="font-size: 20px; font-weight: bold; margin-bottom: 12px;">⚠️ 실행 오류가 감지되었습니다.</h1>
            <p style="font-size: 14px; margin-bottom: 8px;">브라우저가 파일을 불러오지 못했거나 코드에 문제가 있습니다.</p>
            <pre style="font-size: 12px; background: #fff; padding: 12px; border-radius: 8px; overflow-x: auto; border: 1px solid #fee2e2;">${msg}\nURL: ${url}\nLine: ${line}</pre>
            <button onclick="location.reload()" style="margin-top: 16px; padding: 10px 20px; background: #b91c1c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">페이지 새로고침</button>
          </div>
        `;
      }
      return false;
    };
  </script>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react/": "https://esm.sh/react@19.0.0/",
      "react-dom": "https://esm.sh/react-dom@19.0.0",
      "react-dom/": "https://esm.sh/react-dom@19.0.0/",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "@google/genai": "https://esm.sh/@google/genai@1.42.0",
      "recharts": "https://esm.sh/recharts@3.7.0?external=react,react-dom"
    }
  }
  </script>
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; }
    .loading-container {
      display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;
      color: #64748b; font-size: 14px;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid #f1f5f9; border-top-color: #10b981; 
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-container">
      <div class="spinner"></div>
      <p>WellSphere를 시작하는 중...</p>
    </div>
  </div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
